<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="utf-8">
	<title>D&D 5e Wilderness Battlemap Generator</title>
	<meta id="viewport" name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
	<meta name="mobile-web-app-capable" content="yes">
	
	<style>
		@font-face {
			font-family: 'Cinzel Bold';
			src: url('Assets/Cinzel-Bold.woff') format('woff');
			font-weight: normal;
			font-style: normal;
		}
		@font-face {
			font-family: 'Share Tech Regular';
			src: url('Assets/ShareTech-Regular.woff') format('woff');
			font-weight: normal;
			font-style: normal;
		}
		@font-face {
			font-family: 'Share Tech Mono';
			src: url('Assets/ShareTechMono-Regular.woff') format('woff');
			font-weight: normal;
			font-style: normal;
		}

		* { box-sizing: border-box; }
		html, body {
			margin: 0;
			padding: 0;
			height: 100%;
			width: 100%;
			overflow: hidden;
			background: #121215;
			color: #e4e4e7;
			font-family: 'Share Tech Regular', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
			user-select: none;
			-webkit-user-select: none;
		}

		#openfl-content {
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			overflow: hidden;
		}

		#battlemap-canvas {
			width: 100%;
			height: 100%;
			display: block;
		}

		/* UI Overlay Styles */
		#battlemap-ui-overlay {
			position: absolute;
			top: 14px;
			left: 14px;
			z-index: 100;
			display: flex;
			flex-direction: column;
			gap: 10px;
			max-width: 360px;
			pointer-events: none;
		}

		.bm-header, .bm-panel {
			pointer-events: auto;
			background: rgba(24, 24, 28, 0.94);
			backdrop-filter: blur(8px);
			border: 1px solid #3f3f46;
			border-radius: 8px;
			box-shadow: 0 10px 25px rgba(0,0,0,0.5);
			padding: 12px 14px;
		}

		.bm-header {
			display: flex;
			flex-direction: column;
			gap: 8px;
		}

		.bm-title-row {
			display: flex;
			justify-content: space-between;
			align-items: baseline;
			border-bottom: 1px solid #333338;
			padding-bottom: 6px;
		}

		.bm-title {
			font-family: 'Cinzel Bold', serif;
			font-size: 16px;
			letter-spacing: 0.5px;
			color: #f4f4f5;
		}

		.bm-dimensions {
			font-family: 'Share Tech Mono', monospace;
			font-size: 12px;
			color: #a1a1aa;
		}

		.bm-quick-actions {
			display: flex;
			gap: 6px;
			flex-wrap: wrap;
		}

		.bm-quick-actions button, .bm-footer-row button {
			flex: 1;
			min-width: 70px;
			background: #27272a;
			color: #e4e4e7;
			border: 1px solid #52525b;
			border-radius: 4px;
			padding: 6px 8px;
			font-size: 12px;
			cursor: pointer;
			transition: background 0.15s, border-color 0.15s;
			font-family: inherit;
		}

		.bm-quick-actions button:hover, .bm-footer-row button:hover {
			background: #3f3f46;
			border-color: #71717a;
		}

		#btn-reroll {
			background: #2563eb;
			border-color: #3b82f6;
			color: #ffffff;
			font-weight: bold;
		}
		#btn-reroll:hover {
			background: #1d4ed8;
		}

		.bm-panel {
			display: flex;
			flex-direction: column;
			gap: 12px;
			max-height: calc(100vh - 120px);
			overflow-y: auto;
		}

		.bm-section-label {
			display: block;
			font-size: 11px;
			text-transform: uppercase;
			letter-spacing: 1px;
			color: #a1a1aa;
			margin-bottom: 6px;
			font-weight: bold;
		}

		.bm-biome-grid {
			display: grid;
			grid-template-columns: repeat(2, 1fr);
			gap: 4px;
		}

		.bm-biome-btn {
			background: #1f1f23;
			border: 1px solid #3f3f46;
			color: #d4d4d8;
			border-radius: 4px;
			padding: 5px 8px;
			font-size: 11.5px;
			text-align: left;
			cursor: pointer;
			transition: all 0.15s;
			font-family: inherit;
		}

		.bm-biome-btn:hover {
			background: #2e2e34;
			border-color: #71717a;
		}

		.bm-biome-btn.active {
			background: #4338ca;
			border-color: #6366f1;
			color: #ffffff;
			font-weight: bold;
		}

		.bm-toggle-grid {
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 6px;
			font-size: 11.5px;
		}

		.bm-checkbox {
			display: flex;
			align-items: center;
			gap: 6px;
			cursor: pointer;
			color: #d4d4d8;
		}

		.bm-checkbox input {
			cursor: pointer;
			accent-color: #6366f1;
		}

		.bm-row {
			display: flex;
			gap: 8px;
		}

		.bm-col {
			flex: 1;
			display: flex;
			flex-direction: column;
			gap: 4px;
		}

		.bm-label {
			font-size: 11px;
			color: #a1a1aa;
		}

		.bm-select, .bm-input {
			background: #1f1f23;
			border: 1px solid #3f3f46;
			color: #f4f4f5;
			border-radius: 4px;
			padding: 5px 8px;
			font-size: 11.5px;
			font-family: inherit;
			outline: none;
		}

		.bm-select:focus, .bm-input:focus {
			border-color: #6366f1;
		}

		.bm-tool-bar {
			display: flex;
			gap: 4px;
			flex-wrap: wrap;
		}

		.bm-tool-btn {
			flex: 1;
			min-width: 60px;
			background: #1f1f23;
			border: 1px solid #3f3f46;
			color: #d4d4d8;
			border-radius: 4px;
			padding: 5px 6px;
			font-size: 11px;
			cursor: pointer;
			font-family: inherit;
			transition: all 0.15s;
		}

		.bm-tool-btn.active {
			background: #047857;
			border-color: #10b981;
			color: #ffffff;
			font-weight: bold;
		}

		.bm-footer-row {
			display: flex;
			gap: 6px;
			border-top: 1px solid #333338;
			padding-top: 8px;
		}
	</style>
</head>
<body>
	<noscript>This application requires JavaScript to run.</noscript>
	
	<div id="openfl-content"></div>

	<script type="module">
		import { BattlemapApp } from './battlemaps.js';
		window.battlemapApp = new BattlemapApp('openfl-content');
	</script>
</body>
</html>
